# Static site — no build step required.
[build]
  publish = "."

# Service worker must not be cached aggressively so updates roll out quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b43f3">
<title>Workout Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app">
<section id="workouts" class="screen active">
<header class="page-head"><h1>Workouts</h1><div class="subtitle">Find a workout by date</div></header>
<div id="calendar" class="calendar card"></div><div id="summary"></div><button class="fab" onclick="openWorkout()">+</button>
</section>

<section id="exercises" class="screen">
<header class="page-head"><h1>Exercises</h1><div class="subtitle">Exercises grouped by muscle group</div></header>
<div id="exerciseList"></div>
</section>

<section id="library-management" class="screen">
<header class="page-head"><h1>Exercise Library</h1><div class="subtitle">Add, edit and delete exercises</div></header>
<div class="back"><button class="outline" style="padding:10px 14px" onclick="go('more')">‹ Back to More</button></div>
<div id="library"></div><button class="fab" onclick="openExercise()">+</button>
</section>

<section id="progress" class="screen">
<header class="page-head"><h1>Progress</h1><div class="subtitle">Your training history</div></header>
<div id="progressView"></div>
</section>

<section id="more" class="screen">
<header class="page-head"><h1>Settings</h1><div class="subtitle">Manage your app preferences and data</div></header>
<div class="setting-section-title">PREFERENCES</div>
<div class="settings">
<button class="setting card" onclick="go('library-management')"><span class="setting-icon"><svg class="icon"><use href="#book"/></svg></span><span class="setting-main"><span class="setting-title">Exercise Library</span><span class="setting-desc">Manage muscle groups and exercises</span></span><span class="chevron">›</span></button>
<div class="setting card theme-setting"><span class="setting-icon"><svg class="icon"><use href="#theme"/></svg></span><span class="setting-main"><span class="setting-title">Theme</span><span class="setting-desc">Choose light or dark</span></span><span class="segment"><button id="lightBtn" onclick="theme('light')">Light</button><button id="darkBtn" onclick="theme('dark')">Dark</button></span></div>
<button class="setting card" onclick="restoreBackup()"><span class="setting-icon"><svg class="icon"><use href="#upload"/></svg></span><span class="setting-main"><span class="setting-title">Backup & Restore</span><span class="setting-desc">Export or restore your workout data</span></span><span class="chevron">›</span></button>
<button class="setting card" onclick="clearData()"><span class="setting-icon"><svg class="icon"><use href="#trash"/></svg></span><span class="setting-main"><span class="setting-title">Clear All Data</span><span class="setting-desc">Delete all saved data</span></span><span class="chevron">›</span></button>
</div>
<div class="setting-section-title" style="padding-top:31px">ABOUT</div>
<div class="settings"><button class="setting card" onclick="about()"><span class="setting-icon"><svg class="icon"><use href="#info"/></svg></span><span class="setting-main"><span class="setting-title">About Workout Tracker</span><span class="setting-desc">Version, build and app information</span></span><span class="chevron">›</span></button></div>
</section>

<nav class="bottom-nav">
<button class="nav-btn active" data-screen="workouts" onclick="go('workouts')"><svg class="icon"><use href="#calendar-icon"/></svg>Workouts</button>
<button class="nav-btn" data-screen="exercises" onclick="go('exercises')"><svg class="icon"><use href="#dumbbell"/></svg>Exercises</button>
<button class="nav-btn" data-screen="progress" onclick="go('progress')"><svg class="icon"><use href="#chart"/></svg>Progress</button>
<button class="nav-btn" data-screen="more" onclick="go('more')"><svg class="icon"><use href="#more-icon"/></svg>More</button>
</nav>
</div>

<svg width="0" height="0" style="position:absolute">
<symbol id="calendar-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/></symbol>
<symbol id="dumbbell" viewBox="0 0 24 24"><path d="M6 8v8M3 10v4M9 6v12M15 6v12M18 8v8M21 10v4M9 12h6"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M3 20 9 14l4 3 8-10"/><path d="M16 7h5v5"/></symbol>
<symbol id="more-icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H20v18H7.5A3.5 3.5 0 0 0 4 23z"/><path d="M4 5.5v15A3.5 3.5 0 0 1 7.5 17H20"/></symbol>
<symbol id="theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z"/></symbol>
<symbol id="upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 8h.01"/></symbol>
</svg>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"></div>

<script src="js/data.js"></script>
<script src="js/workouts.js"></script>
<script src="js/exercises.js"></script>
<script src="js/progress.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workout Tracker">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Workout Tracker</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#16181d;--muted:#747984;--line:#e7e9ee;--accent:#5b45f5;--accent2:#eeeaff;--danger:#d94b5b;--shadow:0 6px 24px rgba(25,28,38,.05)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif}
button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}
.app{min-height:100vh;padding-bottom:84px}.top{position:sticky;top:0;z-index:10;background:rgba(247,248,250,.94);backdrop-filter:blur(18px);padding:calc(10px + env(safe-area-inset-top)) 16px 9px;border-bottom:1px solid rgba(231,233,238,.7)}
.toprow{display:flex;align-items:center;justify-content:space-between}.title{font-size:24px;font-weight:750;letter-spacing:-.5px}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.content{max-width:720px;margin:0 auto;padding:10px 16px 18px}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:13px;display:grid;place-items:center;font-size:19px}
.primary{background:var(--accent);color:#fff;border-radius:13px;padding:12px 15px;font-weight:700}
.fab{position:fixed;z-index:30;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);width:56px;height:56px;border-radius:19px;background:var(--accent);color:white;font-size:29px;box-shadow:0 10px 25px rgba(91,69,245,.25)}
.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);height:76px;padding:0 8px env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:center}
.nav button{width:20%;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px}.nav button.active{color:var(--accent);font-weight:700}.nav .navicon{font-size:20px;line-height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.datebar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}.datecenter{text-align:center}.date{font-size:18px;font-weight:750}.daylabel{font-size:12px;color:var(--muted);margin-top:2px}
.workouthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.workout-card{cursor:pointer}.select-workout{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--accent);font-weight:700;font-size:14px;text-align:center}.workoutname{font-weight:800;font-size:17px}.edit{color:var(--accent);font-size:13px;font-weight:700}
.group{margin-top:15px}.group:first-child{margin-top:0}.groupname{color:var(--accent);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}.exercise-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}.weight{font-weight:750;color:var(--accent);white-space:nowrap}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.monthtitle{font-size:20px;font-weight:800}.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.dow{font-size:11px;color:var(--muted);margin-bottom:6px}.cell{height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;position:relative;cursor:pointer}.cell.muted{color:#c5c7cd}.cell .num{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}.cell.selected .num{background:var(--accent);color:white;font-weight:800}.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:1px}.monthsummary{margin-top:10px}.summarytitle{font-weight:800}.summarysub{color:var(--muted);font-size:13px;margin-top:3px}
.search{width:100%;height:45px;border:1px solid var(--line);border-radius:13px;background:var(--card);padding:0 13px;outline:none}.chips{display:flex;gap:7px;overflow:auto;margin:10px 0}.chip{padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;white-space:nowrap}.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.exercise-list .exercise-row{padding:14px 2px}.mini-chart{height:170px;margin-top:10px}.bars{height:100%;display:flex;align-items:end;gap:8px;padding:15px 6px 5px;border-bottom:1px solid var(--line)}.bar{flex:1;background:var(--accent);opacity:.78;border-radius:7px 7px 2px 2px;min-height:10px}.chartlabels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:7px}
.metricgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:var(--bg);border-radius:12px;padding:11px}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:18px;margin-top:4px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:none;align-items:end}.sheet{background:var(--card);width:100%;max-height:calc(100dvh - 28px);overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}.modal.show{display:flex}.picker-overlay{position:absolute;inset:0;background:var(--card);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));overflow:auto;z-index:2;-webkit-overflow-scrolling:touch}.picker-overlay .listpick{max-height:none}.handle{width:38px;height:4px;border-radius:5px;background:#d8dae0;margin:0 auto 16px}.sheet h2{margin:0 0 5px;font-size:21px}.sheet .hint{font-size:13px;color:var(--muted);margin-bottom:18px}
.field{margin-bottom:14px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.field input,.field select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;outline:none}.muscles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.muscle{border:1px solid var(--line);border-radius:13px;padding:13px 6px;text-align:center;font-size:12px}.muscle.active{border-color:var(--accent);background:var(--accent2);color:var(--accent);font-weight:750}
.loggroup{margin-top:18px}.loggroup h3{font-size:13px;color:var(--accent);text-transform:uppercase;margin:0 0 4px}.logrow{display:grid;grid-template-columns:1fr 82px 38px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.logrow input{width:82px;height:38px;border:1px solid var(--line);border-radius:10px;text-align:center}.addexercise{color:var(--accent);font-weight:700;font-size:13px;padding:12px 0}.listpick{max-height:50vh;overflow:auto}.pickrow{display:flex;justify-content:space-between;align-items:center;padding:14px 3px;border-bottom:1px solid var(--line)}.pickrow button{color:var(--accent);font-size:22px}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line)}.settings-actions{display:flex;gap:12px;align-items:center}.danger{color:var(--danger);font-size:13px;font-weight:700}
.toast{position:fixed;z-index:70;left:50%;bottom:calc(108px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b1d22;color:white;border-radius:12px;padding:11px 15px;font-size:13px;display:none}.toast.show{display:block}
@media(min-width:760px){.content{padding-top:20px}.nav{max-width:720px;left:50%;right:auto;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}.fab{bottom:92px}}
</style>
</head>
<body>
<div id="app"></div><div id="modal" class="modal"></div><div id="toast" class="toast"></div>
<script>
const muscles=["Chest","Back","Shoulders","Biceps","Triceps","Legs","Abs","Calves","Cardio"];
const defaults={
Chest:["Pec Deck Fly","Inclined Dumbbell Press","Wide Chest Press Machine","Flat Bench Press"],
Back:["Lat Pulldown","Seated Cable Row","Single Arm Dumbbell Row","T-Bar Row","Pull Ups"],
Shoulders:["Inclined Single Dumbbell Side Raise","Reverse Shoulder Press Machine","Barbell Front Raise","Shoulder Upright Row"],
Biceps:["Incline Dumbbell Curl","Hammer Curl","Cable Curl","Behind-the-Back Cable Curl"],
Triceps:["Sitting Barbell Skull Crusher","Flat Grip Cable Pushdown","Overhead Rope Extension","Back Dips"],
Legs:["Smith Machine Squat","Leg Extension","Hamstring Curl","Calf Raises"],
Abs:["Cable Crunch","Hanging Leg Raise","Ab Wheel"],
Calves:["Standing Calf Raise","Seated Calf Raise"],
Cardio:["Treadmill","Cycling","Stair Climber"]
};
let data=JSON.parse(localStorage.getItem("wt_data")||"{}");
let customExercises=JSON.parse(localStorage.getItem("wt_exercises")||"{}");
let library=JSON.parse(localStorage.getItem("wt_library")||"null");
if(!library){library={};muscles.forEach(m=>library[m]=[...new Set([...(defaults[m]||[]),...(customExercises[m]||[])])]);}
muscles.forEach(m=>{library[m]=[...new Set(library[m]||[])];});
let state={view:"month",date:today(),month:today().slice(0,7),exercise:null,filter:"All"};

function today(){return new Date().toISOString().slice(0,10)}
function fmt(d,opts={weekday:"short",day:"numeric",month:"short",year:"numeric"}){return new Date(d+"T12:00:00").toLocaleDateString("en-IN",opts)}
function monthFmt(m){return new Date(m+"-01T12:00:00").toLocaleDateString("en-IN",{month:"long",year:"numeric"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function save(){localStorage.setItem("wt_data",JSON.stringify(data));localStorage.setItem("wt_exercises",JSON.stringify(customExercises));localStorage.setItem("wt_library",JSON.stringify(library))}
function workoutFor(d){return data[d]||null}
function allExercises(m){return [...new Set(library[m]||[])].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"}))}
function history(name){let out=[];Object.keys(data).sort().reverse().forEach(d=>(data[d].groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>{if(e.name===name)out.push({date:d,weight:parseFloat(e.weight)||0,note:e.note})})));return out}
function render(){
 document.getElementById("app").innerHTML=`<div class="app">
 <header class="top"><div class="toprow"><div><div class="title">${state.view==="month"?"Workouts":state.view==="day"?"Workout":state.view==="exercises"?"Exercises":state.view==="settings"?"Settings":"Exercise"}</div><div class="sub">${state.view==="month"?"Find a workout by date":state.view==="day"?fmt(state.date):state.view==="exercises"?"Your exercise library":state.view==="settings"?"Manage your exercises":state.exercise||""}</div></div><button class="iconbtn" onclick="${state.view==="month"||state.view==="day"?"openLog()":state.view==="settings"?"newExercise()":"openLog()"}">＋</button></div></header>
 <main class="content">${state.view==="month"?monthView():state.view==="day"?dayView():state.view==="exercises"?exerciseList():state.view==="settings"?settingsView():exerciseDetail()}</main>
 <button class="fab" onclick="openLog()">＋</button>
 <nav class="nav">
 <button class="${state.view==="month"||state.view==="day"?"active":""}" onclick="goMonth()"><span class="navicon">▣</span>Workouts</button>
 <button class="${state.view==="exercises"||state.view==="detail"?"active":""}" onclick="state.view='exercises';render()"><span class="navicon">⌁</span>Exercises</button>
 <button style="opacity:0;pointer-events:none"><span class="navicon">＋</span>Log</button>
 <button onclick="showToast('Progress view can be added next')"><span class="navicon">↗</span>Progress</button>
 <button class="${state.view==="settings"?"active":""}" onclick="state.view='settings';render()"><span class="navicon">⋯</span>More</button>
 </nav></div>`;
}
function goMonth(){state.view="month";render()}
function monthView(){
 let [y,m]=state.month.split("-").map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),start=first.getDay(),cells=[];
 for(let i=0;i<start;i++)cells.push(`<div class="cell muted"><span class="num"></span></div>`);
 for(let d=1;d<=days;d++){let ds=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`,has=!!workoutFor(ds),sel=ds===state.date;cells.push(`<div class="cell ${sel?"selected":""}" onclick="selectDate('${ds}')"><span class="num">${d}</span>${has?'<span class="dot"></span>':''}</div>`)}
 return `<div class="card"><div class="calendar-head"><button class="iconbtn" onclick="shiftMonth(-1)">‹</button><div class="monthtitle">${monthFmt(state.month)}</div><button class="iconbtn" onclick="shiftMonth(1)">›</button></div><div class="dow">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div>${x}</div>`).join("")}</div><div class="grid">${cells.join("")}</div></div>
 <div class="card monthsummary">${workoutFor(state.date)?`<div class="summarytitle">${fmt(state.date)}</div><div class="summarysub">${esc(workoutFor(state.date).name)} · ${workoutFor(state.date).groups.reduce((n,g)=>n+g.exercises.length,0)} exercises</div><button class="primary" style="width:100%;margin-top:12px" onclick="state.view='day';render()">View Workout</button>`:`<div class="empty" style="padding:18px"><b>${fmt(state.date)}</b>No workout logged</div>`}</div>`;
}
function shiftMonth(n){let d=new Date(state.month+"-01T12:00:00");d.setMonth(d.getMonth()+n);state.month=d.toISOString().slice(0,7);render()}
function selectDate(ds){state.date=ds;state.month=ds.slice(0,7);state.view=workoutFor(ds)?"day":"month";render()}
function dayView(){
 let w=workoutFor(state.date);
 if(!w)return `<div class="card empty"><b>${fmt(state.date)}</b><div>No workout logged.</div><button class="primary" style="margin-top:18px" onclick="openLog()">＋ Log Workout</button></div>`;
 return `<div class="datebar"><button class="iconbtn" onclick="goMonth()">‹</button><div class="datecenter"><div class="date">${fmt(state.date)}</div><div class="daylabel">${esc(w.name)}</div></div><button class="iconbtn" onclick="openLog('${state.date}')">Edit</button></div><div class="card workout-card" onclick="selectWorkout('${state.date}')"><div class="workouthead"><div class="workoutname">${esc(w.name)}</div><button class="edit" onclick="event.stopPropagation();openLog('${state.date}')">Edit</button></div>${w.groups.map(g=>`<div class="group"><div class="groupname">${esc(g.name)}</div>${g.exercises.map(e=>`<div class="exercise-row"><span>${esc(e.name)}</span><span class="weight">${esc(e.weight)} kg</span></div>`).join("")}</div>`).join("")}<div class="select-workout">Select workout</div></div>`;
}
function selectWorkout(d){
 state.date=d;
 state.view="day";
 render();
}
function moveDay(n){let d=new Date(state.date+"T12:00:00");d.setDate(d.getDate()+n);state.date=d.toISOString().slice(0,10);state.month=state.date.slice(0,7);render()}
function exerciseList(){
 let names=[...new Set(muscles.flatMap(allExercises))],q=(document.getElementById("exSearch")?.value||"").toLowerCase();if(q)names=names.filter(n=>n.toLowerCase().includes(q));if(state.filter!=="All")names=allExercises(state.filter).filter(n=>names.includes(n));
 names.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"}));
 return `<input id="exSearch" class="search" placeholder="Search exercises" value="${esc(q)}" oninput="renderExerciseListKeepFocus(this.value)"><div class="chips">${["All",...muscles].map(m=>`<button class="chip ${state.filter===m?"active":""}" onclick="state.filter='${m}';render()">${m}</button>`).join("")}</div><div class="card exercise-list">${names.map(n=>{let last=history(n)[0];return `<div class="exercise-row" onclick="openExercise('${esc(n)}')"><span>${esc(n)}</span><span class="weight">${last?last.weight+" kg":"—"} <small style="color:var(--muted)">›</small></span></div>`}).join("")}</div>`;
}
function renderExerciseListKeepFocus(v){let el=document.getElementById("exSearch"),pos=el?.selectionStart||v.length;render();let n=document.getElementById("exSearch");if(n){n.focus();n.setSelectionRange(pos,pos)}}
function openExercise(n){state.exercise=n;state.view="detail";render()}
function exerciseDetail(){
 let h=history(state.exercise),best=h.length?Math.max(...h.map(x=>x.weight)):0,first=h.length?h[h.length-1].date:"—",max=Math.max(best,1);
 return `<div class="datebar"><button class="iconbtn" onclick="state.view='exercises';render()">‹</button><div class="datecenter"><div class="date">${esc(state.exercise)}</div><div class="daylabel">Progress history</div></div><button class="iconbtn" onclick="openLog()">＋</button></div><div class="card"><div class="metricgrid"><div class="metric"><small>Best Weight</small><strong>${best||"—"} kg</strong></div><div class="metric"><small>First Logged</small><strong>${first==="—"?"—":fmt(first,{day:"numeric",month:"short",year:"numeric"})}</strong></div><div class="metric"><small>Workouts</small><strong>${h.length}</strong></div><div class="metric"><small>Progress</small><strong>${h.length>1?(best-h[h.length-1].weight>=0?"+":"")+((best-h[h.length-1].weight).toFixed(1)).replace(".0","")+" kg":"—"}</strong></div></div></div><div class="card"><div style="font-weight:800">Weight over time</div><div class="mini-chart"><div class="bars">${h.slice().reverse().map(x=>`<div class="bar" style="height:${Math.max(10,(x.weight/max)*120)}px"></div>`).join("")}</div><div class="chartlabels"><span>${h.length?fmt(h[h.length-1].date,{day:"numeric",month:"short"}):""}</span><span>${h.length?fmt(h[0].date,{day:"numeric",month:"short"}):""}</span></div></div></div><div class="card">${h.length?h.map(x=>`<div class="exercise-row"><span>${fmt(x.date,{day:"numeric",month:"short",year:"numeric"})}</span><span class="weight">${x.weight} kg</span></div>`).join(""):`<div class="empty">No history yet.</div>`}</div>`;
}
function settingsView(){
 return `<div class="card"><div class="workouthead"><div><div class="workoutname">Exercise Library</div><div class="summarysub">Manage the exercises available when logging workouts.</div></div><button class="primary" onclick="newExercise()">＋ Add</button></div></div>${muscles.map(m=>`<div class="card"><div class="workouthead"><div class="groupname" style="margin:0">${m}</div><button class="edit" onclick="newExercise('${esc(m)}')">＋ Add</button></div>${allExercises(m).map(n=>`<div class="settings-row"><span>${esc(n)}</span><span class="settings-actions"><button class="edit" onclick="editExercise('${esc(m)}','${esc(n)}')">Edit</button><button class="danger" onclick="deleteExercise('${esc(m)}','${esc(n)}')">Delete</button></span></div>`).join("")}</div>`).join("")}`;
}
function newExercise(group){
 let m=group||prompt("Muscle group:\n"+muscles.join(", "),muscles[0])||"";
 if(!muscles.includes(m))m=muscles.find(x=>x.toLowerCase()===m.toLowerCase())||"";
 if(!m){showToast("Choose a valid muscle group");return}
 let n=prompt("New exercise name","");if(!n)return;n=n.trim();if(!n)return;
 if(allExercises(m).some(x=>x.toLowerCase()===n.toLowerCase())){showToast("Exercise already exists");return}
 library[m]=[...(library[m]||[]),n];customExercises[m]=[...new Set([...(customExercises[m]||[]),n])];save();render();showToast("Exercise added");
}
function editExercise(group,name){
 let n=prompt("Edit exercise name",name);if(!n)return;n=n.trim();if(!n||n===name)return;
 if(allExercises(group).some(x=>x.toLowerCase()===n.toLowerCase()&&x!==name)){showToast("Exercise already exists");return}
 library[group]=(library[group]||[]).map(x=>x===name?n:x);customExercises[group]=(customExercises[group]||[]).map(x=>x===name?n:x);
 Object.values(data).forEach(w=>(w.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>{if(e.name===name)e.name=n})));save();render();showToast("Exercise updated");
}
function deleteExercise(group,name){
 if(!confirm("Delete "+name+" from the exercise library?"))return;
 library[group]=(library[group]||[]).filter(x=>x!==name);customExercises[group]=(customExercises[group]||[]).filter(x=>x!==name);save();render();showToast("Exercise deleted");
}
function openLog(editDate){
 let d=editDate||today(),existing=workoutFor(d);showModal(logStep1(d,existing));
}
function logStep1(d,existing){
 return `<div class="sheet"><div class="handle"></div><h2>Log Workout</h2><div class="hint">Select the muscle groups you trained.</div><div class="field"><label>Date</label><input id="logDate" type="date" value="${d}"></div><div class="muscles">${muscles.map(m=>`<button class="muscle ${existing?.groups.some(g=>g.name===m)?"active":""}" onclick="this.classList.toggle('active')">${m}</button>`).join("")}</div><button class="primary" style="width:100%;margin-top:18px" onclick="nextLogStep()">Next: Add Exercises →</button></div>`;
}
function nextLogStep(){
 let d=document.getElementById("logDate").value,ms=[...document.querySelectorAll(".muscle.active")].map(x=>x.textContent);if(!ms.length){showToast("Select at least one muscle group");return}
 let existing=workoutFor(d);showModal(logStep2(d,ms,existing));
}
function logStep2(d,ms,existing){
 let groups=ms.map(m=>{let old=existing?.groups.find(g=>g.name===m);return {name:m,exercises:old?.exercises||allExercises(m).slice(0,4).map(n=>{let h=history(n);return {name:n,weight:h[0]?.weight||"",note:""}})}})
 return `<div class="sheet"><div class="handle"></div><h2>Add Exercises</h2><div class="hint">${fmt(d)}</div><div id="logGroups">${groups.map(g=>`<div class="loggroup" data-group="${esc(g.name)}"><h3>${esc(g.name)}</h3>${g.exercises.map(e=>logRow(e)).join("")}<button class="addexercise" onclick="openPicker('${esc(g.name)}')">＋ Add Exercise</button></div>`).join("")}</div><button class="primary" style="width:100%;margin-top:18px" onclick="saveWorkout('${d}')">Save Workout</button></div>`;
}
function logRow(e){return `<div class="logrow" data-name="${esc(e.name)}"><span>${esc(e.name)}</span><input inputmode="decimal" value="${esc(e.weight)}" placeholder="kg"><button onclick="this.parentElement.remove()">×</button></div>`}
function openPicker(group){
 let names=allExercises(group);
 let modal=document.getElementById("modal");
 let sheet=modal.querySelector(".sheet");
 if(!sheet)return;
 sheet.insertAdjacentHTML("beforeend",`<div class="picker-overlay"><div class="handle"></div><div class="datebar" style="margin-bottom:18px"><div><h2 style="margin:0">Add Exercise</h2><div class="hint" style="margin:4px 0 0">${esc(group)}</div></div><button class="iconbtn" onclick="closePicker()">×</button></div><button class="addexercise" style="display:block;width:100%;text-align:left;padding-top:0" onclick="createFromPicker('${esc(group)}')">＋ Create New Exercise</button><input id="pickSearch" class="search" placeholder="Search exercises" oninput="filterPicker()"><div id="pickList" class="listpick">${names.map(n=>`<div class="pickrow"><span>${esc(n)}</span><button type="button" class="pick-add" aria-label="Add ${esc(n)}" data-group="${esc(group)}" data-name="${esc(n)}">＋</button></div>`).join("")}</div></div>`);
}
function closePicker(){document.querySelector(".picker-overlay")?.remove()}
function filterPicker(){let q=document.getElementById("pickSearch").value.toLowerCase();document.querySelectorAll("#pickList .pickrow").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"flex":"none")}
function addPicked(group,name){
 let rows=[...document.querySelectorAll(`#logGroups .loggroup[data-group="${CSS.escape(group)}"] .logrow`)];
 if(rows.some(r=>r.dataset.name===name)){closePicker();showToast("Exercise already added");return}
 let container=document.querySelector(`#logGroups .loggroup[data-group="${CSS.escape(group)}"]`);
 if(!container){showToast("Could not add exercise");return}
 container.querySelector(".addexercise").insertAdjacentHTML("beforebegin",logRow({name,weight:history(name)[0]?.weight||"",note:""}));
 closePicker();
}
function createFromPicker(group){
 let n=prompt("New exercise name","");if(!n)return;n=n.trim();if(!n)return;
 if(allExercises(group).some(x=>x.toLowerCase()===n.toLowerCase())){showToast("Exercise already exists");return}
 library[group]=[...(library[group]||[]),n];customExercises[group]=[...new Set([...(customExercises[group]||[]),n])];save();
 closePicker();
 let container=document.querySelector(`#logGroups .loggroup[data-group="${CSS.escape(group)}"]`);
 if(container)container.querySelector(".addexercise").insertAdjacentHTML("beforebegin",logRow({name:n,weight:"",note:""}));
}
function saveWorkout(d){
 let groups=[...document.querySelectorAll("#logGroups .loggroup")].map(g=>({name:g.dataset.group,exercises:[...g.querySelectorAll(".logrow")].map(r=>({name:r.dataset.name,weight:r.querySelector("input").value.trim(),note:""})).filter(e=>e.weight!=="")})).filter(g=>g.exercises.length);
 if(!groups.length){showToast("Enter at least one weight");return}
 let name=groups.map(g=>g.name).join(" + ");data[d]={name,groups,time:new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})};save();state.date=d;state.month=d.slice(0,7);closeModal();state.view="day";render();showToast("Workout saved");
}
function showModal(html){let m=document.getElementById("modal");m.innerHTML=html;m.classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function showToast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
document.getElementById("modal").addEventListener("click",e=>{
 if(e.target.id==="modal"){closeModal();return}
 const add=e.target.closest(".pick-add");
 if(add){
   e.preventDefault();
   e.stopPropagation();
   addPicked(add.dataset.group,add.dataset.name);
 }
});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
render();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workout Tracker">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Workout Tracker</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#16181d;--muted:#747984;--line:#e7e9ee;--accent:#5b45f5;--accent2:#eeeaff;--danger:#d94b5b;--nav:#fff;--shadow:0 8px 30px rgba(25,28,38,.06)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif}
button,input{font:inherit}
button{border:0;background:none;color:inherit}

.app{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;background:rgba(247,248,250,.94);backdrop-filter:blur(18px);padding:calc(12px + env(safe-area-inset-top)) 18px 10px;border-bottom:1px solid rgba(231,233,238,.7)}
.toprow{display:flex;align-items:center;justify-content:space-between}.title{font-size:25px;font-weight:750;letter-spacing:-.5px}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.content{max-width:720px;margin:0 auto;padding:16px}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:13px;display:grid;place-items:center;font-size:19px}
.primary{background:var(--accent);color:#fff;border-radius:14px;padding:13px 16px;font-weight:700}

.fab{position:fixed;z-index:30;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%);width:58px;height:58px;border-radius:20px;background:var(--accent);color:white;font-size:30px;box-shadow:0 10px 25px rgba(91,69,245,.28)}

.nav{
 position:fixed;z-index:20;bottom:0;left:0;right:0;
 background:rgba(255,255,255,.96);backdrop-filter:blur(18px);
 border-top:1px solid var(--line);
 height:calc(88px + env(safe-area-inset-bottom));
 padding:8px 0 env(safe-area-inset-bottom);
 display:flex;justify-content:space-around;align-items:center;
}
.nav button{
 width:25%;min-height:58px;padding:5px 0 4px;
 font-size:11px;color:var(--muted);
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:7px;
}
.nav button.active{color:var(--accent);font-weight:700}
.nav .navicon{font-size:20px;line-height:20px;height:20px;display:flex;align-items:center;justify-content:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.datecenter{text-align:center}.date{font-size:18px;font-weight:750}.daylabel{font-size:12px;color:var(--muted);margin-top:2px}
.workouthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.workoutname{font-weight:800;font-size:17px}.edit{color:var(--accent);font-size:13px;font-weight:700}
.group{margin-top:16px}.group:first-child{margin-top:0}.groupname{color:var(--accent);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}.exercise-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line);font-size:15px}.weight{font-weight:750;color:var(--accent);white-space:nowrap}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.monthtitle{font-size:20px;font-weight:800}.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.dow{font-size:11px;color:var(--muted);margin-bottom:8px}.cell{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;position:relative;cursor:pointer}.cell.muted{color:#c5c7cd}.cell .num{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}.cell.selected .num{background:var(--accent);color:white;font-weight:800}.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:2px}.monthsummary{margin-top:12px}.summarytitle{font-weight:800}.summarysub{color:var(--muted);font-size:13px;margin-top:3px}
.search{width:100%;height:45px;border:1px solid var(--line);border-radius:13px;background:var(--card);padding:0 13px;outline:none}.chips{display:flex;gap:7px;overflow:auto;margin:12px 0}.chip{padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;white-space:nowrap}.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.exercise-list .exercise-row{padding:15px 2px}.mini-chart{height:170px;margin-top:10px}.bars{height:100%;display:flex;align-items:end;gap:8px;padding:15px 6px 5px;border-bottom:1px solid var(--line)}.bar{flex:1;background:var(--accent);opacity:.78;border-radius:7px 7px 2px 2px;min-height:10px}.chartlabels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:7px}
.metricgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:var(--bg);border-radius:12px;padding:12px}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:18px;margin-top:4px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:none;align-items:end}.sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}.modal.show{display:flex}.handle{width:38px;height:4px;border-radius:5px;background:#d8dae0;margin:0 auto 16px}.sheet h2{margin:0 0 5px;font-size:21px}.sheet .hint{font-size:13px;color:var(--muted);margin-bottom:18px}
.field{margin-bottom:14px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.field input,.field select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;outline:none}.muscles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.muscle{border:1px solid var(--line);border-radius:13px;padding:14px 6px;text-align:center;font-size:12px}.muscle.active{border-color:var(--accent);background:var(--accent2);color:var(--accent);font-weight:750}
.loggroup{margin-top:18px}.loggroup h3{font-size:13px;color:var(--accent);text-transform:uppercase;margin:0 0 4px}.logrow{display:grid;grid-template-columns:1fr 82px 38px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.logrow input{width:82px;height:38px;border:1px solid var(--line);border-radius:10px;text-align:center}.addexercise{color:var(--accent);font-weight:700;font-size:13px;padding:12px 0}.listpick{max-height:50vh;overflow:auto}.pickrow{display:flex;justify-content:space-between;padding:14px 3px;border-bottom:1px solid var(--line)}.pickrow button{color:var(--accent);font-size:22px}
.toast{position:fixed;z-index:70;left:50%;bottom:115px;transform:translateX(-50%);background:#1b1d22;color:white;border-radius:12px;padding:11px 15px;font-size:13px;display:none}.toast.show{display:block}
@media(min-width:760px){
 .content{padding-top:24px}
 .nav{max-width:720px;left:50%;right:auto;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}
 .fab{bottom:38px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal"></div>
<div id="toast" class="toast"></div>
<script>
const muscles=["Chest","Back","Shoulders","Biceps","Triceps","Legs","Abs","Calves","Cardio"];
const defaults={
Chest:["Pec Deck Fly","Inclined Dumbbell Press","Wide Chest Press Machine","Flat Bench Press"],
Back:["Lat Pulldown","Seated Cable Row","Single Arm Dumbbell Row","T-Bar Row","Pull Ups"],
Shoulders:["Inclined Single Dumbbell Side Raise","Reverse Shoulder Press Machine","Barbell Front Raise","Shoulder Upright Row"],
Biceps:["Incline Dumbbell Curl","Hammer Curl","Cable Curl","Behind-the-Back Cable Curl"],
Triceps:["Sitting Barbell Skull Crusher","Flat Grip Cable Pushdown","Overhead Rope Extension","Back Dips"],
Legs:["Smith Machine Squat","Leg Extension","Hamstring Curl","Calf Raises"],
Abs:["Cable Crunch","Hanging Leg Raise","Ab Wheel"],
Calves:["Standing Calf Raise","Seated Calf Raise"],
Cardio:["Treadmill","Cycling","Stair Climber"]
};
let data=JSON.parse(localStorage.getItem("wt_data")||"{}");
let customExercises=JSON.parse(localStorage.getItem("wt_exercises")||"{}");
let state={view:"month",date:today(),month:today().slice(0,7),exercise:null,filter:"All"};

function save(){localStorage.setItem("wt_data",JSON.stringify(data));localStorage.setItem("wt_exercises",JSON.stringify(customExercises))}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d,opts={weekday:"short",day:"numeric",month:"short",year:"numeric"}){return new Date(d+"T12:00:00").toLocaleDateString("en-IN",opts)}
function monthFmt(m){return new Date(m+"-01T12:00:00").toLocaleDateString("en-IN",{month:"long",year:"numeric"})}
function key(d){return d}
function workoutFor(d){return data[key(d)]||null}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function allExercises(m){return [...new Set([...(defaults[m]||[]),...((customExercises[m]||[]))])]}
function setData(d,obj){data[d]=obj;save()}
function render(){document.getElementById("app").innerHTML=`
<div class="app"><header class="top"><div class="toprow"><div><div class="title">${state.view==="month"?"Workouts":state.view==="day"?"Workout":state.view==="exercises"?"Exercises":"Exercise"}</div><div class="sub">${state.view==="month"?"Find a workout by date":state.view==="day"?fmt(state.date):state.view==="exercises"?"Your exercise library":state.exercise||""}</div></div><button class="iconbtn" onclick="${state.view==="month"?"openLog()":state.view==="day"?"openLog()":"goMonth()"}">＋</button></div></header>
<main class="content">${state.view==="month"?monthView():state.view==="day"?dayView():state.view==="exercises"?exerciseList():exerciseDetail()}</main>
<button class="fab" onclick="openLog()">＋</button>
<nav class="nav">
<button class="${state.view==="month"||state.view==="day"?"active":""}" onclick="goMonth()"><span class="navicon">▣</span>Workouts</button>
<button class="${state.view==="exercises"||state.view==="detail"?"active":""}" onclick="state.view='exercises';render()"><span class="navicon">⌁</span>Exercises</button>
<button style="opacity:0;pointer-events:none"><span class="navicon">＋</span></button>
<button onclick="showToast('Progress view can be added next')"><span class="navicon">↗</span>Progress</button>
<button onclick="showToast('Settings coming later')"><span class="navicon">⋯</span>More</button>
</nav></div>`}
function goMonth(){state.view="month";render()}
function monthView(){
 let [y,m]=state.month.split("-").map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),start=first.getDay(),cells=[];
 for(let i=0;i<start;i++)cells.push(`<div class="cell muted"><span class="num"></span></div>`);
 for(let d=1;d<=days;d++){let ds=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`,has=!!workoutFor(ds),sel=ds===state.date;cells.push(`<div class="cell ${sel?"selected":""}" onclick="selectDate('${ds}')"><span class="num">${d}</span>${has?'<span class="dot"></span>':''}</div>`)}
 return `<div class="card"><div class="calendar-head"><button class="iconbtn" onclick="shiftMonth(-1)">‹</button><div class="monthtitle">${monthFmt(state.month)}</div><button class="iconbtn" onclick="shiftMonth(1)">›</button></div><div class="dow">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div>${x}</div>`).join("")}</div><div class="grid">${cells.join("")}</div></div>
 <div class="card monthsummary">${workoutFor(state.date)?`<div class="summarytitle">${fmt(state.date)}</div><div class="summarysub">${esc(workoutFor(state.date).name)} · ${workoutFor(state.date).groups.reduce((n,g)=>n+g.exercises.length,0)} exercises</div><button class="primary" style="width:100%;margin-top:13px" onclick="state.view='day';render()">View Workout</button>`:`<div class="empty" style="padding:20px"><b>${fmt(state.date)}</b>No workout logged</div>`}</div>`
}
function shiftMonth(n){let d=new Date(state.month+"-01T12:00:00");d.setMonth(d.getMonth()+n);state.month=d.toISOString().slice(0,7);render()}
function selectDate(ds){state.date=ds;state.month=ds.slice(0,7);state.view=workoutFor(ds)?"day":"month";render()}
function dayView(){
 let w=workoutFor(state.date);if(!w)return `<div class="card empty"><b>${fmt(state.date)}</b><div>No workout logged.</div><button class="primary" style="margin-top:18px" onclick="openLog()">＋ Log Workout</button></div>`;
 return `<div class="datebar"><button class="iconbtn" onclick="moveDay(-1)">‹</button><div class="datecenter"><div class="date">${fmt(state.date)}</div><div class="daylabel">${esc(w.name)}</div></div><button class="iconbtn" onclick="moveDay(1)">›</button></div><div class="card"><div class="workouthead"><div class="workoutname">${esc(w.name)}</div><button class="edit" onclick="openLog('${state.date}')">Edit</button></div>${w.groups.map(g=>`<div class="group"><div class="groupname">${esc(g.name)}</div>${g.exercises.map(e=>`<div class="exercise-row"><span>${esc(e.name)}</span><span class="weight">${esc(e.weight)} kg${e.note?" · "+esc(e.note):""}</span></div>`).join("")}</div>`).join("")}</div><div class="card"><div class="metricgrid"><div class="metric"><small>Exercises</small><strong>${w.groups.reduce((n,g)=>n+g.exercises.length,0)}</strong></div><div class="metric"><small>Logged</small><strong>${w.time||"—"}</strong></div></div></div>`
}
function moveDay(n){let d=new Date(state.date+"T12:00:00");d.setDate(d.getDate()+n);state.date=d.toISOString().slice(0,10);state.month=state.date.slice(0,7);render()}
function exerciseList(){
 let names=[...new Set(muscles.flatMap(allExercises))],q=(document.getElementById("exSearch")?.value||"").toLowerCase();if(q)names=names.filter(n=>n.toLowerCase().includes(q));
 if(state.filter!=="All")names=allExercises(state.filter).filter(n=>names.includes(n));
 return `<input id="exSearch" class="search" placeholder="Search exercises" value="${esc(q)}" oninput="renderExerciseListKeepFocus(this.value)"><div class="chips">${["All",...muscles].map(m=>`<button class="chip ${state.filter===m?"active":""}" onclick="state.filter='${m}';render()">${m}</button>`).join("")}</div><div class="card exercise-list">${names.map(n=>{let hist=history(n);let last=hist[0];return `<div class="exercise-row" onclick="openExercise('${esc(n)}')"><span>${esc(n)}</span><span class="weight">${last?last.weight+" kg":"—"} <small style="color:var(--muted)">›</small></span></div>`}).join("")}</div>`
}
function renderExerciseListKeepFocus(v){let el=document.getElementById("exSearch");let pos=el.selectionStart;render();let n=document.getElementById("exSearch");if(n){n.focus();n.setSelectionRange(pos,pos)}}
function history(name){let out=[];Object.keys(data).sort().reverse().forEach(d=>data[d].groups.forEach(g=>g.exercises.forEach(e=>{if(e.name===name)out.push({date:d,weight:parseFloat(e.weight)||0,note:e.note})})));return out}
function openExercise(n){state.exercise=n;state.view="detail";render()}
function exerciseDetail(){
 let h=history(state.exercise),best=h.length?Math.max(...h.map(x=>x.weight)):0,first=h.length?h[h.length-1].date:"—";let max=Math.max(best,1);
 return `<div class="datebar"><button class="iconbtn" onclick="state.view='exercises';render()">‹</button><div class="datecenter"><div class="date">${esc(state.exercise)}</div><div class="daylabel">Progress history</div></div><button class="iconbtn" onclick="openLog()">＋</button></div><div class="card"><div class="metricgrid"><div class="metric"><small>Best Weight</small><strong>${best||"—"} kg</strong></div><div class="metric"><small>First Logged</small><strong>${first==="—"?"—":fmt(first,{day:"numeric",month:"short",year:"numeric"})}</strong></div><div class="metric"><small>Workouts</small><strong>${h.length}</strong></div><div class="metric"><small>Progress</small><strong>${h.length>1?((best-h[h.length-1].weight)>=0?"+":"")+((best-h[h.length-1].weight).toFixed(1)).replace(".0","")+" kg":"—"}</strong></div></div></div><div class="card"><div style="font-weight:800">Weight over time</div><div class="mini-chart"><div class="bars">${h.slice().reverse().map(x=>`<div class="bar" style="height:${Math.max(10,(x.weight/max)*120)}px" title="${x.weight} kg"></div>`).join("")}</div><div class="chartlabels"><span>${h.length?fmt(h[h.length-1].date,{day:"numeric",month:"short"}):""}</span><span>${h.length?fmt(h[0].date,{day:"numeric",month:"short"}):""}</span></div></div></div><div class="card">${h.length?h.map(x=>`<div class="exercise-row"><span>${fmt(x.date,{day:"numeric",month:"short",year:"numeric"})}</span><span class="weight">${x.weight} kg${x.note?" · "+esc(x.note):""}</span></div>`).join(""):`<div class="empty">No history yet.</div>`}</div>`
}
function openLog(editDate){let d=editDate||today(),existing=workoutFor(d);showModal(logStep1(d,existing))}
function logStep1(d,existing){return `<div class="sheet"><div class="handle"></div><h2>Log Workout</h2><div class="hint">Select the muscle groups you trained.</div><div class="field"><label>Date</label><input id="logDate" type="date" value="${d}"></div><div class="muscles">${muscles.map(m=>`<button class="muscle ${existing?.groups.some(g=>g.name===m)?"active":""}" onclick="this.classList.toggle('active')">${m}</button>`).join("")}</div><button class="primary" style="width:100%;margin-top:18px" onclick="nextLogStep()">Next: Add Exercises →</button></div>`}
function nextLogStep(){let d=document.getElementById("logDate").value,ms=[...document.querySelectorAll(".muscle.active")].map(x=>x.textContent);if(!ms.length){showToast("Select at least one muscle group");return}let existing=workoutFor(d);showModal(logStep2(d,ms,existing))}
function logStep2(d,ms,existing){let groups=ms.map(m=>{let old=existing?.groups.find(g=>g.name===m);return {name:m,exercises:old?.exercises||allExercises(m).slice(0,4).map(n=>{let h=history(n);return {name:n,weight:h[0]?.weight||"",note:""}})}});return `<div class="sheet"><div class="handle"></div><h2>Add Exercises</h2><div class="hint">${fmt(d)}</div><div id="logGroups">${groups.map(g=>`<div class="loggroup" data-group="${esc(g.name)}"><h3>${esc(g.name)}</h3>${g.exercises.map(e=>logRow(e)).join("")}<button class="addexercise" onclick="openPicker('${esc(g.name)}')">＋ Add Exercise</button></div>`).join("")}</div><button class="primary" style="width:100%;margin-top:18px" onclick="saveWorkout('${d}')">Save Workout</button></div>`}
function logRow(e){return `<div class="logrow" data-name="${esc(e.name)}"><span>${esc(e.name)}</span><input inputmode="decimal" value="${esc(e.weight)}" placeholder="kg"><button onclick="this.parentElement.remove()">×</button></div>`}
function openPicker(group){let names=allExercises(group);showModal(`<div class="sheet"><div class="handle"></div><h2>Add Exercise</h2><div class="hint">${esc(group)}</div><input id="pickSearch" class="search" placeholder="Search exercises" oninput="filterPicker()"><div id="pickList" class="listpick">${names.map(n=>`<div class="pickrow"><span>${esc(n)}</span><button onclick="addPicked('${esc(group)}','${esc(n)}')">＋</button></div>`).join("")}</div></div>`)}
function filterPicker(){let q=document.getElementById("pickSearch").value.toLowerCase();document.querySelectorAll("#pickList .pickrow").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"flex":"none")}
function addPicked(group,name){let rows=[...document.querySelectorAll(`#logGroups .loggroup[data-group="${CSS.escape(group)}"] .logrow`)];if(rows.some(r=>r.dataset.name===name)){closeModal();return}let container=document.querySelector(`#logGroups .loggroup[data-group="${CSS.escape(group)}"]`);let add=container.querySelector(".addexercise");add.insertAdjacentHTML("beforebegin",logRow({name,weight:history(name)[0]?.weight||"",note:""}));closeModal()}
function saveWorkout(d){let groups=[...document.querySelectorAll("#logGroups .loggroup")].map(g=>({name:g.dataset.group,exercises:[...g.querySelectorAll(".logrow")].map(r=>({name:r.dataset.name,weight:r.querySelector("input").value.trim(),note:""})).filter(e=>e.weight!=="")})).filter(g=>g.exercises.length);if(!groups.length){showToast("Enter at least one weight");return}let name=groups.map(g=>g.name).join(" + ");setData(d,{name,groups,time:new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})});state.date=d;state.month=d.slice(0,7);closeModal();state.view="day";render();showToast("Workout saved")}
function showModal(html){let m=document.getElementById("modal");m.innerHTML=html;m.classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()})
function showToast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
render();
</script>
</body>
</html>
